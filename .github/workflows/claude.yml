name: Claude Code

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  auto-pr-review:
    name: Auto PR Review
    if: |
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.draft == false &&
      github.actor != 'claude[bot]'

    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write

    steps:
      - name: Checkout base repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude automatic PR review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Please review this pull request.

            Repository: ${{ github.repository }}
            Pull request number: ${{ github.event.pull_request.number }}
            Pull request title: ${{ github.event.pull_request.title }}
            Pull request author: ${{ github.event.pull_request.user.login }}
            Base branch: ${{ github.event.pull_request.base.ref }}
            Head branch: ${{ github.event.pull_request.head.ref }}

            Review requirements:
            - Focus on correctness, logic bugs, edge cases, security issues, and maintainability.
            - Do not modify files or push commits.
            - Do not run code from the pull request.
            - Analyze the PR diff and relevant repository context.
            - Post a concise PR review summary.
            - Use inline review comments only for concrete issues tied to specific changed lines.
            - If there are no substantial issues, say so clearly.

          claude_args: |
            --max-turns 5
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}

  claude-mention:
    name: Respond to @claude
    if: |
      github.actor != 'claude[bot]' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
      )

    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write

    steps:
      - name: Checkout base repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude on mention
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 10
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
